name: CapitalMonero Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: pub get
        run: flutter pub get
      - name: gen-l10n
        run: flutter gen-l10n
      - name: analyze
        run: flutter analyze
      - name: test (with coverage)
        run: flutter test --coverage --reporter expanded
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: pub get
        run: flutter pub get
      - name: gen-l10n
        run: flutter gen-l10n
      - name: Decode signing key
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/capitalmonero.jks
          echo "$KEY_PROPERTIES" > android/key.properties
      - name: Build production AAB
        run: flutter build appbundle --release --flavor production
      - name: Build production APK
        run: flutter build apk --release --flavor production
      - name: Build F-Droid APK
        run: flutter build apk --release --flavor fdroid
      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            build/app/outputs/bundle/productionRelease/*.aab
            build/app/outputs/flutter-apk/*.apk

  build-ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: pub get
        run: flutter pub get
      - name: gen-l10n
        run: flutter gen-l10n
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Build IPA (no codesign)
        run: flutter build ipa --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/ipa/*.ipa

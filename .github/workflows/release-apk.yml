# Builds Flutter Android APKs (production + fdroid flavors) and attaches them
# to a GitHub Release whenever a version tag (e.g. v1.0.0) is pushed.
name: Build & Release APK

on:
  push:
    tags:
      - "v*"

# Allow the job to upload assets to the GitHub Release
permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source code ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java (required by Android Gradle toolchain) ─────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ── 3. Flutter SDK ──────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.x"
          cache: true

      # ── 4. Dart / Flutter dependencies ─────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── 5. Code generation (freezed, json_serializable, injectable, drift) ─
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # ── 6. Build APKs ───────────────────────────────────────────────────────
      - name: Build production APK
        run: flutter build apk --flavor production --release

      - name: Build fdroid APK
        run: flutter build apk --flavor fdroid --release

      # ── 7. Attach APKs to the GitHub Release ────────────────────────────────
      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Picks up both flavor APKs written by `flutter build apk`
          files: build/app/outputs/flutter-apk/*.apk

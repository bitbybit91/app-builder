{% extends "base.html" %}
{% block title %}Browse Offers - P2P XMR Exchange{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Browse Offers</h1>
    <a href="/create-offer" class="btn btn-primary">+ Create Offer</a>
</div>

<div class="offers-layout">
    <aside class="filter-sidebar">
        <h3>Filter Offers</h3>
        <form id="filter-form">
            <div class="form-group">
                <label>Type</label>
                <select name="type" id="filter-type" class="form-control">
                    <option value="">All</option>
                    <option value="sell">Sell (Buy XMR)</option>
                    <option value="buy">Buy (Sell XMR)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Fiat Currency</label>
                <input type="text" name="fiat_currency" id="filter-currency" class="form-control" placeholder="USD, EUR, GBP...">
            </div>
            <div class="form-group">
                <label>Payment Method</label>
                <input type="text" name="payment_method" id="filter-payment" class="form-control" placeholder="Bank transfer, Cash...">
            </div>
            <div class="form-group">
                <label>Country</label>
                <input type="text" name="country" id="filter-country" class="form-control" placeholder="US, UK, DE...">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Apply Filters</button>
            <button type="button" class="btn btn-secondary btn-block mt-2" onclick="clearFilters()">Clear</button>
        </form>
    </aside>

    <main class="offers-main">
        <div id="offers-container">
            <p class="loading">Loading offers...</p>
        </div>
        <div class="pagination" id="pagination"></div>
    </main>
</div>

<script>
var currentPage = 1;
var currentFilters = {};

function getFiltersFromUrl() {
    var params = new URLSearchParams(window.location.search);
    var filters = {};
    ['type','fiat_currency','payment_method','country'].forEach(function(k) {
        var v = params.get(k);
        if (v) filters[k] = v;
    });
    return filters;
}

function applyFiltersToForm(filters) {
    if (filters.type) document.getElementById('filter-type').value = filters.type;
    if (filters.fiat_currency) document.getElementById('filter-currency').value = filters.fiat_currency;
    if (filters.payment_method) document.getElementById('filter-payment').value = filters.payment_method;
    if (filters.country) document.getElementById('filter-country').value = filters.country;
}

function loadOffers(page, filters) {
    var params = Object.assign({page: page, per_page: 20}, filters);
    App.api.getOffers(params).then(function(data) {
        var container = document.getElementById('offers-container');
        if (data.offers && data.offers.length > 0) {
            container.innerHTML = data.offers.map(App.render.offerCard).join('');
        } else {
            container.innerHTML = '<p class="empty-state">No offers found. Try adjusting your filters.</p>';
        }
        renderPagination(data.page, data.pages);
    }).catch(function() {
        document.getElementById('offers-container').innerHTML = '<p class="error">Failed to load offers.</p>';
    });
}

function renderPagination(current, total) {
    var pag = document.getElementById('pagination');
    if (total <= 1) { pag.innerHTML = ''; return; }
    var html = '';
    if (current > 1) html += '<button class="btn btn-sm" onclick="goPage(' + (current-1) + ')">&#8592; Prev</button>';
    html += '<span class="page-info"> Page ' + current + ' of ' + total + ' </span>';
    if (current < total) html += '<button class="btn btn-sm" onclick="goPage(' + (current+1) + ')">Next &#8594;</button>';
    pag.innerHTML = html;
}

function goPage(page) {
    currentPage = page;
    loadOffers(currentPage, currentFilters);
    window.scrollTo(0, 0);
}

function clearFilters() {
    document.getElementById('filter-form').reset();
    currentFilters = {};
    currentPage = 1;
    loadOffers(1, {});
}

document.getElementById('filter-form').addEventListener('submit', function(e) {
    e.preventDefault();
    currentFilters = {
        type: document.getElementById('filter-type').value,
        fiat_currency: document.getElementById('filter-currency').value,
        payment_method: document.getElementById('filter-payment').value,
        country: document.getElementById('filter-country').value,
    };
    Object.keys(currentFilters).forEach(function(k) { if (!currentFilters[k]) delete currentFilters[k]; });
    currentPage = 1;
    loadOffers(1, currentFilters);
});

document.addEventListener('DOMContentLoaded', function() {
    currentFilters = getFiltersFromUrl();
    applyFiltersToForm(currentFilters);
    loadOffers(currentPage, currentFilters);
});
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Wallet - P2P XMR Exchange{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Wallet</h1>
</div>
<div class="wallet-layout">
    <div class="wallet-balance card">
        <h3>Balance</h3>
        <div class="balance-display">
            <div class="balance-total" id="balance-total">Loading...</div>
            <div class="balance-unlocked" id="balance-unlocked"></div>
        </div>
        <div class="network-status" id="network-status">Checking network...</div>
    </div>
    <div class="wallet-deposit card">
        <h3>Deposit XMR</h3>
        <p>Send XMR to this address to fund your trading account:</p>
        <button class="btn btn-primary" onclick="getDepositAddress()">Generate Deposit Address</button>
        <div id="deposit-address" class="deposit-address"></div>
    </div>
    <div class="wallet-withdraw card">
        <h3>Withdraw XMR</h3>
        <form id="withdraw-form">
            <div class="form-group">
                <label>Recipient Address</label>
                <input type="text" id="withdraw-address" class="form-control" placeholder="Monero address..." required>
            </div>
            <div class="form-group">
                <label>Amount (XMR)</label>
                <input type="number" id="withdraw-amount" class="form-control" placeholder="0.1" min="0.001" step="0.001" required>
            </div>
            <button type="submit" class="btn btn-primary">Withdraw</button>
        </form>
    </div>
    <div class="wallet-history card">
        <h3>Transaction History</h3>
        <div id="tx-history">Loading...</div>
    </div>
</div>
<script>
function loadBalance() {
    App.api.getBalance().then(function(data) {
        document.getElementById('balance-total').innerHTML = '<strong>' + (data.balance || 0).toFixed(6) + ' XMR</strong>';
        document.getElementById('balance-unlocked').textContent = 'Unlocked: ' + (data.unlocked_balance || 0).toFixed(6) + ' XMR';
    }).catch(function() {
        document.getElementById('balance-total').textContent = 'RPC Unavailable';
    });
}
function loadNetworkStatus() {
    App.api.getNetworkStatus().then(function(data) {
        document.getElementById('network-status').textContent = data.status === 'connected' ? '\u2713 Network: Block ' + data.height : '\u2717 Disconnected';
    });
}
function getDepositAddress() {
    App.api.getDepositAddress().then(function(data) {
        document.getElementById('deposit-address').innerHTML = '<div class="address-box"><code class="mono">' + data.address + '</code></div>';
    }).catch(function(err) { App.flash('Error: ' + err.message, 'error'); });
}
document.getElementById('withdraw-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var addr = document.getElementById('withdraw-address').value;
    var amt = parseFloat(document.getElementById('withdraw-amount').value);
    if (confirm('Withdraw ' + amt + ' XMR to ' + addr + '?')) {
        App.api.withdraw(addr, amt).then(function(data) {
            App.flash('Withdrawal submitted! TX: ' + data.txid, 'success');
            loadBalance();
        }).catch(function(err) { App.flash('Error: ' + err.message, 'error'); });
    }
});
function loadTxHistory() {
    App.api.getTransactions().then(function(data) {
        var txs = (data.transactions && data.transactions['in']) ? data.transactions['in'] : [];
        var html = txs.length > 0 ?
            '<table class="tx-table"><thead><tr><th>Type</th><th>Amount</th><th>Confirmations</th><th>Date</th></tr></thead><tbody>' +
            txs.map(function(tx) {
                return '<tr><td>In</td><td>' + (tx.amount/1e12).toFixed(6) + ' XMR</td><td>' + tx.confirmations + '</td><td>' + new Date(tx.timestamp * 1000).toLocaleDateString() + '</td></tr>';
            }).join('') + '</tbody></table>' :
            '<p class="empty-state">No transactions yet.</p>';
        document.getElementById('tx-history').innerHTML = html;
    }).catch(function() { document.getElementById('tx-history').textContent = 'Failed to load transactions.'; });
}
document.addEventListener('DOMContentLoaded', function() {
    loadBalance();
    loadNetworkStatus();
    loadTxHistory();
});
</script>
{% endblock %}

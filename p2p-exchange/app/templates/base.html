<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="no-referrer">
    <title>{% block title %}P2P XMR Exchange{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/" class="brand-link">⚡ XMR P2P</a>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/offers" class="nav-link">Offers</a>
            <a href="/create-offer" class="nav-link">+ Create Offer</a>
            <a href="/wallet" class="nav-link">Wallet</a>
            <a href="/about" class="nav-link">About</a>
        </div>
        <div class="nav-session" id="nav-session">
            <button id="btn-create-session" class="btn btn-primary btn-sm" onclick="App.initSession()">Connect</button>
        </div>
    </nav>

    <div class="flash-messages" id="flash-messages"></div>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>P2P XMR Exchange &mdash; No KYC. Non-custodial. Private.</p>
            <p class="footer-links">
                <a href="/about">About</a> &bull;
                <a href="/about#faq">FAQ</a> &bull;
                <a href="/about#security">Security</a>
            </p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

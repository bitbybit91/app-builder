{% extends "base.html" %}
{% block title %}Trade #{{ trade_id }} - P2P XMR Exchange{% endblock %}
{% block content %}
<div class="trade-layout">
    <div class="trade-main">
        <div class="card">
            <h2>Trade #{{ trade_id }}</h2>
            <div id="trade-status-bar" class="status-bar">Loading...</div>
            <div id="trade-details" class="trade-details"></div>
            <div id="trade-actions" class="trade-actions"></div>
        </div>
        <div class="card mt-4">
            <h3>Escrow Information</h3>
            <div id="escrow-info" class="escrow-info"></div>
        </div>
    </div>
    <div class="trade-chat">
        <div class="card chat-card">
            <h3>Encrypted Chat</h3>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-area">
                <textarea id="chat-input" class="form-control" rows="2" placeholder="Type a message..."></textarea>
                <button class="btn btn-primary mt-2" onclick="sendMessage()">Send (Encrypted)</button>
            </div>
        </div>
    </div>
</div>

<script>
var tradeId = {{ trade_id }};
var trade = null;
var pollInterval = null;
var lastMsgId = 0;

function renderTradeStatus(t) {
    var statuses = ['initiated','escrow_funded','fiat_sent','fiat_received','completed'];
    var bar = document.getElementById('trade-status-bar');
    if (['cancelled','disputed'].indexOf(t.status) !== -1) {
        bar.innerHTML = '<div class="status-badge status-' + t.status + '">' + t.status.toUpperCase() + '</div>';
        return;
    }
    bar.innerHTML = '<div class="status-steps">' +
        statuses.map(function(s, i) {
            var idx = statuses.indexOf(t.status);
            var cls = 'step' + (s === t.status ? ' active' : '') + (i < idx ? ' done' : '');
            return (i > 0 ? '<div class="step-arrow">&#8594;</div>' : '') +
                '<div class="' + cls + '">' + s.replace(/_/g,' ') + '</div>';
        }).join('') +
    '</div>';
}

function renderTradeDetails(t) {
    document.getElementById('trade-details').innerHTML =
        '<div class="detail-grid">' +
        '<div><strong>Amount:</strong> ' + t.amount_xmr + ' XMR</div>' +
        '<div><strong>Fiat:</strong> ' + t.amount_fiat + ' ' + t.fiat_currency + '</div>' +
        '<div><strong>Buyer ID:</strong> #' + t.buyer_id + '</div>' +
        '<div><strong>Seller ID:</strong> #' + t.seller_id + '</div>' +
        '<div><strong>Created:</strong> ' + new Date(t.created_at).toLocaleString() + '</div>' +
        (t.dispute_reason ? '<div class="dispute-reason"><strong>Dispute:</strong> ' + t.dispute_reason + '</div>' : '') +
        '</div>';
    document.getElementById('escrow-info').innerHTML = t.escrow_address ?
        '<div class="escrow-address"><strong>Escrow Address:</strong><br><code class="mono">' + t.escrow_address + '</code></div>' +
        (t.escrow_txid ? '<div><strong>Funding TX:</strong> <code class="mono">' + t.escrow_txid + '</code></div>' : '') :
        '<p>Escrow address pending...</p>';
}

function renderTradeActions(t) {
    var session = App.session.get();
    if (!session) return;
    var userId = session.user ? session.user.id : null;
    var html = '';
    if (t.status === 'initiated' && userId === t.seller_id) {
        html += '<button class="btn btn-primary" onclick="confirmEscrow()">Confirm Escrow Funded</button> ';
    }
    if (t.status === 'escrow_funded' && userId === t.buyer_id) {
        html += '<button class="btn btn-primary" onclick="markFiatSent()">I Sent the Fiat Payment</button> ';
    }
    if (t.status === 'fiat_sent' && userId === t.seller_id) {
        html += '<button class="btn btn-success" onclick="markFiatReceived()">I Received Fiat - Release Escrow</button> ';
    }
    if (t.status === 'fiat_received' && userId === t.seller_id) {
        html += '<button class="btn btn-success" onclick="completeTrade()">Complete Trade</button> ';
    }
    if (['initiated','escrow_funded'].indexOf(t.status) !== -1) {
        html += '<button class="btn btn-danger" onclick="cancelTrade()">Cancel</button> ';
    }
    if (['escrow_funded','fiat_sent'].indexOf(t.status) !== -1) {
        html += '<button class="btn btn-warning" onclick="openDisputeDialog()">Open Dispute</button>';
    }
    document.getElementById('trade-actions').innerHTML = html;
}

function loadTrade() {
    App.api.getTrade(tradeId).then(function(t) {
        trade = t;
        renderTradeStatus(t);
        renderTradeDetails(t);
        renderTradeActions(t);
    });
}

function loadMessages() {
    App.api.getMessages(tradeId, lastMsgId).then(function(data) {
        if (data.messages && data.messages.length > 0) {
            var container = document.getElementById('chat-messages');
            data.messages.forEach(function(m) {
                var div = document.createElement('div');
                var session = App.session.get();
                var isMe = session && session.user && m.sender_id === session.user.id;
                div.className = 'chat-bubble ' + (isMe ? 'me' : 'them');
                div.innerHTML = '<div class="bubble-content">[Encrypted] Sender #' + m.sender_id + '</div>' +
                    '<div class="bubble-time">' + new Date(m.created_at).toLocaleTimeString() + '</div>';
                container.appendChild(div);
                lastMsgId = Math.max(lastMsgId, m.id);
            });
            container.scrollTop = container.scrollHeight;
        }
    });
}

function sendMessage() {
    var input = document.getElementById('chat-input');
    var text = input.value.trim();
    if (!text) return;
    App.chat.sendEncrypted(tradeId, text).then(function() {
        input.value = '';
        loadMessages();
    }).catch(function(err) {
        App.flash('Send failed: ' + (err.message || 'error'), 'error');
    });
}

function confirmEscrow() {
    var txid = prompt('Enter the funding transaction ID (optional):') || '';
    App.api.confirmEscrow(tradeId, txid).then(loadTrade);
}
function markFiatSent() {
    if (confirm('Confirm you have sent the fiat payment?')) App.api.fiatSent(tradeId).then(loadTrade);
}
function markFiatReceived() {
    if (confirm('Confirm you received the fiat payment and want to release XMR from escrow?')) App.api.fiatReceived(tradeId).then(loadTrade);
}
function completeTrade() {
    if (confirm('Complete this trade and release escrow?')) App.api.completeTrade(tradeId).then(loadTrade);
}
function cancelTrade() {
    if (confirm('Cancel this trade?')) App.api.cancelTrade(tradeId).then(loadTrade);
}
function openDisputeDialog() {
    var reason = prompt('Describe the dispute reason:');
    if (reason) App.api.openDispute(tradeId, reason).then(loadTrade);
}

document.addEventListener('DOMContentLoaded', function() {
    loadTrade();
    loadMessages();
    pollInterval = setInterval(function() { loadTrade(); loadMessages(); }, 10000);
});
</script>
{% endblock %}

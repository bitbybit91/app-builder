{% extends "base.html" %}
{% block title %}Chat - Trade #{{ trade_id }}{% endblock %}
{% block content %}
<div class="chat-page">
    <div class="card chat-card-full">
        <div class="chat-header">
            <h2>Trade #{{ trade_id }} - Encrypted Chat</h2>
            <a href="/trade/{{ trade_id }}" class="btn btn-sm btn-secondary">&#8592; Back to Trade</a>
        </div>
        <div id="chat-messages" class="chat-messages-full"></div>
        <div class="chat-input-area">
            <textarea id="chat-input" class="form-control" rows="3" placeholder="Message (end-to-end encrypted)..."></textarea>
            <div class="chat-input-actions">
                <span class="encryption-badge">🔒 E2E Encrypted</span>
                <button class="btn btn-primary" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
</div>
<script>
var tradeId = {{ trade_id }};
var lastMsgId = 0;
function loadMessages() {
    App.api.getMessages(tradeId, lastMsgId).then(function(data) {
        if (data.messages && data.messages.length > 0) {
            var container = document.getElementById('chat-messages');
            data.messages.forEach(function(m) {
                var div = document.createElement('div');
                var session = App.session.get();
                var isMe = session && session.user && m.sender_id === session.user.id;
                div.className = 'chat-bubble ' + (isMe ? 'me' : 'them');
                div.innerHTML = '<div class="bubble-content">[Encrypted] #' + m.sender_id + '</div>' +
                    '<div class="bubble-time">' + new Date(m.created_at).toLocaleTimeString() + '</div>';
                container.appendChild(div);
                lastMsgId = Math.max(lastMsgId, m.id);
            });
            container.scrollTop = container.scrollHeight;
        }
    });
}
function sendMessage() {
    var text = document.getElementById('chat-input').value.trim();
    if (!text) return;
    App.chat.sendEncrypted(tradeId, text).then(function() {
        document.getElementById('chat-input').value = '';
        loadMessages();
    }).catch(function(err) { App.flash('Error: ' + err.message, 'error'); });
}
document.addEventListener('DOMContentLoaded', function() {
    loadMessages();
    setInterval(loadMessages, 5000);
});
</script>
{% endblock %}

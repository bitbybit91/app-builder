# =============================================================================
# Apache Virtual Host — P2P Exchange (Port 80)
# =============================================================================
# Install: sudo cp deploy/apache.conf /etc/apache2/sites-available/p2p-exchange.conf
# Enable:  sudo a2ensite p2p-exchange && sudo systemctl reload apache2
#
# Prerequisites:
#   sudo apt install apache2 libapache2-mod-proxy-html
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite
# =============================================================================

<VirtualHost *:80>
    ServerName localhost
    # ServerAlias your-domain.com

    # ---- Logging ----
    ErrorLog ${APACHE_LOG_DIR}/p2p-exchange-error.log
    CustomLog ${APACHE_LOG_DIR}/p2p-exchange-access.log combined

    # ---- Reverse Proxy to Gunicorn ----
    ProxyPreserveHost On
    ProxyPass /static/ !
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # ---- WebSocket Proxy ----
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:8000/$1" [P,L]

    # ---- Static Files (served directly by Apache) ----
    Alias /static/ /var/www/p2p-exchange/app/static/
    <Directory /var/www/p2p-exchange/app/static/>
        Require all granted
        Options -Indexes
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType text/css "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType image/svg+xml "access plus 1 year"
        </IfModule>
    </Directory>

    # ---- Security Headers ----
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

    # ---- HSTS (uncomment for clearnet HTTPS) ----
    # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # ---- Disable server version disclosure ----
    ServerSignature Off

    # ---- Rate Limiting (mod_ratelimit) ----
    <IfModule mod_ratelimit.c>
        <Location /api/>
            SetOutputFilter RATE_LIMIT
            SetEnv rate-limit 1024
        </Location>
    </IfModule>

</VirtualHost>

{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div style="max-width:400px; margin:3rem auto;">
  <div class="card">
    <h2>Create Account</h2>
    <form method="post" action="/register">
      <div class="form-group">
        <label>Username (3-20 alphanumeric)</label>
        <input type="text" name="username" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9]+" placeholder="myusername">
      </div>
      <div class="form-group">
        <label>Password (min 8 characters)</label>
        <input type="password" name="password" required minlength="8" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required minlength="8" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Register</button>
    </form>
    <p style="text-align:center; margin-top:1rem; color:var(--muted); font-size:0.9rem;">Already have an account? <a href="/login">Log in</a></p>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Create Offer{% endblock %}
{% block content %}
<div style="max-width:600px; margin:0 auto;">
  <h1>Create Offer</h1>
  <div class="card">
    <form method="post" action="/offers/create">
      <div class="grid-2">
        <div class="form-group">
          <label>Offer Type</label>
          <select name="offer_type" required>
            <option value="sell">Sell XMR (I have XMR to sell)</option>
            <option value="buy">Buy XMR (I want to buy XMR)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Fiat Currency</label>
          <select name="fiat_currency" required>
            <option value="USD">USD &mdash; US Dollar</option>
            <option value="EUR">EUR &mdash; Euro</option>
            <option value="GBP">GBP &mdash; British Pound</option>
            <option value="CAD">CAD &mdash; Canadian Dollar</option>
            <option value="AUD">AUD &mdash; Australian Dollar</option>
            <option value="JPY">JPY &mdash; Japanese Yen</option>
            <option value="CHF">CHF &mdash; Swiss Franc</option>
            <option value="BRL">BRL &mdash; Brazilian Real</option>
            <option value="MXN">MXN &mdash; Mexican Peso</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Price Margin (%) &mdash; Between -20% and +50% over market price</label>
        <input type="number" name="price_margin" value="0" min="-20" max="50" step="0.1" required>
        <small style="color:var(--muted);">0% = market price. Positive = above market (you sell at premium). Negative = below market (discount).</small>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Minimum Amount (fiat)</label>
          <input type="number" name="min_amount" min="0.01" step="0.01" required placeholder="10.00">
        </div>
        <div class="form-group">
          <label>Maximum Amount (fiat)</label>
          <input type="number" name="max_amount" min="0.01" step="0.01" required placeholder="1000.00">
        </div>
      </div>
      <div class="form-group">
        <label>Payment Method</label>
        <input type="text" name="payment_method" required placeholder="Bank Transfer, Cash, PayPal, etc." maxlength="100">
      </div>
      <div class="form-group">
        <label>Terms &amp; Instructions (optional)</label>
        <textarea name="terms" rows="4" placeholder="Describe your trading terms..." maxlength="1000"></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Create Offer</button>
    </form>
  </div>
</div>
{% endblock %}

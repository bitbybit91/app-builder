name: capital_monero
description: CapitalMonero — P2P Monero/Bitcoin trading platform
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  bip39: ^1.0.6
  dartz: ^0.10.1
  dio: ^5.7.0
  drift: ^2.22.1
  equatable: ^2.0.7
  firebase_core: ^3.9.0
  firebase_messaging: ^15.1.6
  flutter_bloc: ^8.1.6
  flutter_secure_storage: ^9.2.3
  freezed_annotation: ^2.4.4
  get_it: ^8.0.3
  go_router: ^14.8.1
  injectable: ^2.5.0
  intl: ^0.19.0
  json_annotation: ^4.9.0
  local_auth: ^2.3.0
  mobile_scanner: ^6.0.2
  pointycastle: ^3.9.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^9.1.7
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  flutter_lints: ^5.0.0
  freezed: ^2.5.8
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

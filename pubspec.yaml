name: capital_monero
description: CapitalMonero - Peer-to-peer cryptocurrency exchange
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_bloc: ^8.1.3
  go_router: ^13.0.0
  dio: ^5.4.0
  get_it: ^7.6.4
  injectable: ^2.3.2
  flutter_secure_storage: ^9.0.0
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  equatable: ^2.0.5
  dartz: ^0.10.1
  json_annotation: ^4.8.1
  intl: ^0.19.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  url_launcher: ^6.2.1
  share_plus: ^7.2.1
  connectivity_plus: ^5.0.2
  local_auth: ^2.1.7
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  pointycastle: ^3.7.4
  bip39: ^1.0.6
  encrypt: ^5.0.3
  uuid: ^4.2.1
  timeago: ^3.6.0
  image_picker: ^1.0.5
  permission_handler: ^11.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  pull_to_refresh: ^2.0.0
  logger: ^2.0.2
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.1
  freezed_annotation: ^2.4.1
  copy_with_extension: ^5.0.4
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  freezed: ^2.4.5
  injectable_generator: ^2.4.1
  drift_dev: ^2.14.0
  mockito: ^5.4.3
  bloc_test: ^9.1.5
  copy_with_extension_gen: ^5.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

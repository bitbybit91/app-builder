Categories:
  - Money
License: GPL-3.0-or-later
AuthorName: CapitalMonero Contributors
SourceCode: https://github.com/bitbybit91/app-builder
IssueTracker: https://github.com/bitbybit91/app-builder/issues
Changelog: https://github.com/bitbybit91/app-builder/releases

AutoName: CapitalMonero

RepoType: git
Repo: https://github.com/bitbybit91/app-builder

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: app
    gradle:
      - release
    prebuild:
      - echo "storeFile=../release.keystore" >> ../keys.properties
      - echo "storePassword=$FDROID_KEY_PASSWORD" >> ../keys.properties
      - echo "keyAlias=$FDROID_KEY_ALIAS" >> ../keys.properties
      - echo "keyPassword=$FDROID_KEY_PASSWORD" >> ../keys.properties
    build:
      - ./gradlew assembleRelease
    output: build/outputs/apk/release/app-release.apk
    rm:
      - keys.properties
      - release.keystore

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1

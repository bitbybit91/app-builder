# Memory-tuned for low-spec hosts (4 GB RAM / dual-core AMD E1-2100).
# Keep the JVM heap small enough to leave room for the Dart VM, Kotlin
# daemon, and the OS. UseSerialGC has the smallest footprint.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8

org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=false

android.enableJetifier=true
android.useAndroidX=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

kotlin.daemon.jvmargs=-Xmx768m -XX:+UseSerialGC
kotlin.incremental=true
kotlin.code.style=official

# Gradle JVM memory constraints — tuned for 4 GB RAM host machine
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC

# Disable the Gradle daemon to reduce persistent memory usage on low-spec machines
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.caching=false

# Kotlin daemon memory limit
kotlin.daemon.jvmargs=-Xmx768m -XX:+UseSerialGC

# AndroidX + Jetifier
android.useAndroidX=true
android.enableJetifier=true

# Dart VM heap constraint
DART_VM_OPTIONS=--old_gen_heap_size=512

# Gradle process environment
GRADLE_OPTS=-Xmx512m -Dfile.encoding=UTF-8

# Java tool chain limit
JAVA_TOOL_OPTIONS=-Xmx768m -XX:+UseSerialGC

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.capitalmonero.app"
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.capitalmonero.app"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    dexOptions {
        javaMaxHeapSize "768m"
    }

    flavorDimensions "distribution"
    productFlavors {
        production {
            dimension "distribution"
        }
        fdroid {
            dimension "distribution"
        }
    }

    lint {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.multidex:multidex:2.0.1'

    // Firebase is only included for the production flavor.
    // The fdroid flavor intentionally excludes all proprietary Google/Firebase
    // libraries to satisfy F-Droid's Free/Open Source requirement.
    productionImplementation platform('com.google.firebase:firebase-bom:32.7.0')
    productionImplementation 'com.google.firebase:firebase-messaging'
    productionImplementation 'com.google.firebase:firebase-analytics'
}

// Apply the google-services plugin only when google-services.json is present.
// Production builds supply this file; fdroid builds intentionally omit it so
// that no proprietary Firebase configuration is required.
if (file("google-services.json").exists()) {
    apply plugin: 'com.google.gms.google-services'
}
